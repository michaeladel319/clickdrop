services:
  - type: web
    name: social-media-video-downloader-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: downloader-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SWAGGER_ENABLED
        value: "true"
      - key: STORAGE_DRIVER
        value: "local"

databases:
  - name: downloader-db
    plan: free
    region: oregon
