services:
  - type: web
    name: clickdrop-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: clickdrop-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SWAGGER_ENABLED
        value: "true"
      - key: STORAGE_DRIVER
        value: "local"

databases:
  - name: clickdrop-db
    plan: free
    region: frankfurt
